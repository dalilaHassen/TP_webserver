<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Person Form (Servlet)</title></head>
<body>
    <h2>Enter your information</h2>
    <form action="FormServlet" method="post">
        <label for="firstName">First name:</label>
        <input type="text" id="firstName" name="firstName" required><br><br>

        <label for="lastName">Last name:</label>
        <input type="text" id="lastName" name="lastName" required><br><br>

        <label for="birthDate">Birth date (mm/dd/yyyy):</label>
        <input type="text" id="birthDate" name="birthDate" placeholder="mm/dd/yyyy"
               pattern="(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{4}"
               title="Format: mm/dd/yyyy" required><br><br>

        Sex:
        <input type="radio" id="male" name="sex" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="sex" value="Female">
        <label for="female">Female</label>
        <br><br>

        <input type="submit" value="Send">
    </form>
    <p><a href="ReadCookie">Read the cookies (ReadCookie)</a></p>
    <p><a href="VisitCounter">Visit counter (cookie)</a></p>
</body>
</html>
